name: Update lottery data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 4"

permissions:
  contents: write

jobs:
  update-winners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update winners.json
        run: node scripts/update-winners.mjs
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/winners.json; then
            echo "No new lottery data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/winners.json
          git commit -m "Update lottery data"
          git push
