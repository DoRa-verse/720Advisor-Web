name: Update lottery data

on:
  workflow_dispatch:
  schedule:
    # Every Thursday 22:30 KST, after the weekly draw result is usually available.
    - cron: "30 13 * * 4"
    # Backup retry every Friday 06:00 KST in case the result page was delayed.
    - cron: "0 21 * * 4"

permissions:
  contents: write

concurrency:
  group: update-lottery-data
  cancel-in-progress: false

jobs:
  update-winners:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Update winners.json
        run: node scripts/update-winners.mjs
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/winners.json; then
            echo "No new lottery data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/winners.json
          git commit -m "Update lottery data"
          git push
