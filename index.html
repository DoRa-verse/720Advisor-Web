<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>연금복권720+ 통계 추천기</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">Pension Lottery 720+</p>
          <h1>연금복권720+ 통계 추천기</h1>
          <p class="disclaimer">최근 당첨 흐름을 참고해 다섯 가지 방식으로 번호를 뽑아봅니다.</p>
        </div>
        <div class="actions">
          <button id="updateData" class="primary" title="웹 배포 데이터 파일을 다시 읽습니다.">데이터 새로고침</button>
          <button id="refreshAll">5가지 다시 추천</button>
        </div>
      </section>

      <section class="stats-grid" aria-label="통계 요약">
        <article>
          <span>통계 데이터</span>
          <strong id="roundCount">-</strong>
        </article>
        <article>
          <span>최신 회차</span>
          <strong id="latestRound">-</strong>
        </article>
        <article>
          <span>마지막 업데이트</span>
          <strong id="updatedAt">-</strong>
        </article>
      </section>

      <p id="dataStatus" class="data-status" role="status"></p>

      <section class="draw-panel" aria-label="최근 추첨 결과">
        <div class="draw-title">
          <div>
            <h2 id="drawTitle">최근 추첨 결과</h2>
            <p id="drawDate">통계 업데이트 후 표시됩니다.</p>
          </div>
        </div>
        <div class="draw-results">
          <div class="prize-label">
            <strong>1등</strong>
            <span>월 700만원 × 20년</span>
          </div>
          <div id="firstPrize" class="number-line"></div>
          <div class="prize-label">
            <strong>보너스</strong>
            <span>월 100만원 × 10년</span>
          </div>
          <div id="bonusPrize" class="number-line"></div>
        </div>
      </section>

      <section id="cards" class="cards" aria-live="polite"></section>

      <section class="panel number-analyzer" aria-label="내 번호 분석">
        <div>
          <h2>내 번호 분석</h2>
          <p>조를 제외한 숫자 6개를 입력하면 수집된 당첨번호 기준으로 흐름과 패턴을 간단히 분석합니다.</p>
        </div>
        <div class="analyzer-box">
          <div class="analysis-entry">
            <label for="analysisNumber">번호 6자리</label>
            <input id="analysisNumber" aria-label="분석할 숫자 6자리" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="예: 547326">
          </div>
          <div id="analysisPreview" class="analysis-preview" aria-label="입력한 숫자 미리보기"></div>
          <div class="analysis-actions">
            <button id="analyzeNumber" class="primary">분석하기</button>
            <button id="clearAnalysis">지우기</button>
          </div>
          <div id="analysisResult" class="analysis-result" aria-live="polite">
            <p>분석할 숫자 6개를 입력해 주세요.</p>
          </div>
        </div>
      </section>

      <section class="panel">
        <div>
          <h2>5장 살 때 섞는 법</h2>
          <p id="mixAdvice">통계를 불러오는 중입니다.</p>
        </div>
        <div id="mixPlan" class="mix-plan"></div>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
